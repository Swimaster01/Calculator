<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <main>
      <div class="display">
        <div id="previous-operand"></div>
        <div id="current-operand">0</div>
    </div>

    <div class="buttons">
        <button data-action="clear">AC</button>
        <button data-action="delete">DEL</button>
        <button data-action="percentage">%</button>
        <button data-operator="divide">÷</button>
    </div>
    <div class="buttons">
        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button data-operator="multiply">×</button>
    </div>
    <div class="buttons">
        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button data-operator="subtract">−</button>
    </div>
    <div class="buttons">
        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button data-operator="add">+</button>
    </div>
    <div class="buttons">
        <button data-action="sign">±</button>
        <button data-number="0">0</button>
        <button data-action="decimal">.</button>
        <button data-action="equals">=</button>
    </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
